services:
  mysql:
    image: mysql:8.0
    container_name: mysql

    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: cloud_publishing
      MYSQL_USER: user
      MYSQL_PASSWORD: pass

    ports:
      - "23306:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./local-data.sql:/docker-entrypoint-initdb.d/02-local-data.sql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-proot_password", "-h", "localhost"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s

volumes:
  mysql_data: